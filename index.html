<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Juego del Amor 💖</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .contenedor {
            text-align: center;
        }

        h1 {
            color: #fff;
            margin-bottom: 30px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
        }

        #si {
            background-color: #4CAF50;
            color: white;
        }

        #no {
            background-color: #f44336;
            color: white;
            position: absolute;
        }

        .marca {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font-size: 14px;
            color: rgba(255,255,255,0.7);
        }
    </style>
</head>
<body>

    <div class="contenedor" id="contenido">
        <h1>¿Quieres ser mi novia? 💕</h1>
        <button id="si" onclick="aceptar()">Sí 💖</button>
        <button id="no" onmouseover="moverNo()">No 😢</button>
    </div>

    <div class="marca">creador ofc Elder .P</div>

    <script>
        function moverNo() {
            const botonNo = document.getElementById("no");
            const ancho = window.innerWidth - botonNo.offsetWidth;
            const alto = window.innerHeight - botonNo.offsetHeight;

            const x = Math.random() * ancho;
            const y = Math.random() * alto;

            botonNo.style.left = x + "px";
            botonNo.style.top = y + "px";
        }

        function aceptar() {
            document.getElementById("contenido").innerHTML = `
                <h1>🎉 Felicidades 🎉</h1>
                <h1>💖 Somos novios 💖</h1>
            `;
        }
    </script>

</body>
</html>
