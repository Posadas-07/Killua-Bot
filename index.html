<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💘 Algo Especial</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    height:100vh;
    font-family:'Segoe UI',sans-serif;
    background:radial-gradient(circle at top,#ffb3c6,#ff5d8f);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* ===== CARGANDO ===== */
#loader{
    position:fixed;
    inset:0;
    background:linear-gradient(135deg,#ff4d8d,#ff99bb);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:white;
    z-index:999;
}

.loader-heart{
    font-size:60px;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    50%{transform:scale(1.4)}
}

/* ===== TARJETA ===== */
.card{
    background:rgba(255,255,255,0.96);
    width:90%;
    max-width:370px;
    padding:35px 22px;
    border-radius:40px;
    text-align:center;
    box-shadow:0 30px 60px rgba(0,0,0,.35);
    display:none;
    z-index:5;
}

h1{
    color:#e91e63;
    font-size:24px;
    margin-bottom:25px;
    text-shadow:0 0 12px rgba(233,30,99,.6);
}

/* ===== BOTONES ===== */
.buttons{position:relative;height:140px}

button{
    padding:15px 30px;
    font-size:18px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 8px 18px rgba(0,0,0,.25);
}

#yes{
    background:linear-gradient(45deg,#ff2f92,#ff7ab6);
    color:white;
}

#no{
    background:#aaa;
    color:white;
    position:absolute;
    top:75px;
    left:50%;
    transform:translateX(-50%);
}

/* ===== CORAZONES ===== */
.heart{
    position:fixed;
    bottom:-30px;
    animation:floatUp linear forwards;
    z-index:1;
}

@keyframes floatUp{
    to{
        transform:translateY(-120vh) rotate(360deg);
        opacity:0;
    }
}

/* ===== CONFETI ===== */
.confetti{
    position:fixed;
    top:-10px;
    width:10px;
    height:10px;
    animation:fall 3s linear forwards;
    z-index:10;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(720deg);
        opacity:0;
    }
}

/* ===== MARCA DE AGUA TEXTO ===== */
.watermark{
    position:fixed;
    bottom:18px;
    width:100%;
    text-align:center;
    font-size:30px;
    font-weight:900;
    letter-spacing:4px;
    color:white;
    text-shadow:
        0 0 10px #fff,
        0 0 25px #ff4d8d,
        0 0 50px #ff005d,
        0 0 80px #ff008c;
    animation:glow 1.5s infinite alternate;
    z-index:20;
}

@keyframes glow{
    from{filter:brightness(1)}
    to{filter:brightness(1.8)}
}

/* ===== LOGO ===== */
.logo{
    position:fixed;
    top:15px;
    right:15px;
    width:70px;
    height:70px;
    border-radius:20px;
    animation:floatLogo 2.5s ease-in-out infinite;
    box-shadow:0 0 25px #fff;
    z-index:25;
}

@keyframes floatLogo{
    50%{transform:translateY(-8px)}
}
</style>
</head>

<body>

<!-- CARGANDO -->
<div id="loader">
    <div class="loader-heart">💖</div>
    <p>Cargando algo muy bonito...</p>
</div>

<!-- LOGO -->
<img src="https://cdn.russellxz.click/e7ae3a32.jpeg" class="logo">

<!-- TARJETA -->
<div class="card" id="card">
    <h1>Oye, una pregunta…<br>¿quieres ser mi novia? 💕</h1>
    <div class="buttons">
        <button id="yes" onclick="aceptar()">Sí 💘</button>
        <button id="no" onmouseenter="moverNo()" ontouchstart="moverNo()">No 🙈</button>
    </div>
</div>

<!-- MARCA -->
<div class="watermark">CREADOR OFICIAL ELDER .P</div>

<!-- MÚSICA -->
<audio id="music" loop>
    <source src="https://cdn.pixabay.com/audio/2023/03/27/audio_8a35b0c92b.mp3">
</audio>

<script>
const loader=document.getElementById("loader");
const card=document.getElementById("card");
const noBtn=document.getElementById("no");
const music=document.getElementById("music");

/* LOADER */
setTimeout(()=>{
    loader.style.display="none";
    card.style.display="block";
},2300);

/* BOTÓN NO */
function moverNo(){
    const x=Math.random()*280-140;
    const y=Math.random()*140-70;
    noBtn.style.transform=`translate(${x}px,${y}px) rotate(${Math.random()*40-20}deg)`;
}

/* ACEPTAR */
function aceptar(){
    music.play();
    if(navigator.vibrate) navigator.vibrate([200,100,200]);

    // Confeti
    for(let i=0;i<80;i++){
        const c=document.createElement("div");
        c.className="confetti";
        c.style.left=Math.random()*100+"vw";
        c.style.background=`hsl(${Math.random()*360},100%,60%)`;
        c.style.animationDuration=2+Math.random()*2+"s";
        document.body.appendChild(c);
        setTimeout(()=>c.remove(),4000);
    }

    card.innerHTML=`
        <h1>🎉 FELICIDADES 🎉</h1>
        <h1>💞 SOMOS NOVIOS 💞</h1>
        <p style="color:#e91e63;font-size:18px;margin-top:15px">
        Prometo cuidarte, quererte y hacerte sonreír 💕
        </p>
    `;
}

/* CORAZONES */
setInterval(()=>{
    const h=document.createElement("div");
    h.className="heart";
    h.innerText=["💖","💘","💗","💕","❤️"][Math.floor(Math.random()*5)];
    h.style.left=Math.random()*100+"vw";
    h.style.fontSize=20+Math.random()*20+"px";
    h.style.animationDuration=4+Math.random()*4+"s";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),8000);
},300);
</script>

</body>
</html>
