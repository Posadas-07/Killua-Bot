<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💘 Una Pregunta Especial</title>

<style>
/* === ESTILOS BASE === */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: linear-gradient(135deg, #ffe3e8, #ffdee5);
    font-family: "Segoe UI", sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

/* === TARJETA PRINCIPAL === */
.card {
    background: rgba(255,255,255,0.98);
    width: 90%;
    max-width: 360px;
    padding: 30px 20px;
    border-radius: 35px;
    box-shadow: 0px 10px 25px rgba(0,0,0,0.15);
    z-index: 10;
    animation: fadeIn 1s ease forwards;
}

/* === TEXTO === */
h1 {
    color: #e82e6c;
    font-size: 24px;
    margin-bottom: 22px;
    text-shadow: 0px 1px 6px rgba(232,46,108,0.5);
}

/* === BOTONES === */
.buttons {
    position: relative;
    height: 120px;
}

button {
    padding: 14px 28px;
    font-size: 18px;
    border-radius: 28px;
    border: none;
    cursor: pointer;
    transition: 0.2s;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

#yes {
    background: linear-gradient(45deg, #ff5fa1, #ff80b3);
    color: white;
}

#no {
    background: #b3b3b3;
    color: white;
    position: absolute;
    left: 50%;
    top: 60px;
    transform: translateX(-50%);
}

/* === CORAZONES ===== */
.heart {
    position: fixed;
    bottom: -20px;
    font-size: 22px;
    animation: floatUp 5s linear infinite;
    opacity: 0.85;
    z-index: 1;
}

/* === ANIMACIONES === */
@keyframes floatUp {
    0% {
        transform: translateY(0) scale(1);
        opacity: 1;
    }
    100% {
        transform: translateY(-110vh) scale(1.5);
        opacity: 0;
    }
}

@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
}

/* === MARCA DE AGUA === */
.watermark-container {
    position: fixed;
    bottom: 20px;
    width: 100%;
    text-align: center;
    z-index: 9;
}

.watermark-text {
    font-size: 24px;
    color: rgba(255,255,255,0.9);
    font-weight: bold;
    letter-spacing: 2px;
    text-shadow: 0 0 12px #fff, 0 0 18px #ff6699, 0 0 25px #ff0099;
    animation: glow 2s ease infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 8px #fff, 0 0 12px #ff6699; }
    to { text-shadow: 0 0 18px #fff, 0 0 30px #ff0099, 0 0 40px #ff66cc; }
}

/* === IMAGEN EN ESQUINA === */
.logo-corner {
    position: fixed;
    top: 15px;
    right: 15px;
    width: 60px;
    height: 60px;
    border-radius: 20px;
    box-shadow: 0px 4px 12px rgba(0,0,0,0.3);
    z-index: 12;
}
</style>

</head>
<body>

<!-- LOGO EN ESQUINA -->
<img src="https://cdn.russellxz.click/e7ae3a32.jpeg" class="logo-corner" alt="Marca">

<div class="card" id="card">
    <h1>💞 Una pregunta especial para ti 💞</h1>
    <div class="buttons">
        <button id="yes" onclick="aceptar()">Sí, claro 💖</button>
        <button id="no" onmouseover="moverNo()" ontouchstart="moverNo()">No 🙈</button>
    </div>
</div>

<div class="watermark-container">
    <div class="watermark-text">CREADOR OFICIAL ELDER .P</div>
</div>

<!-- MÚSICA ROMÁNTICA -->
<audio id="music" loop>
    <source src="https://cdn.pixabay.com/audio/2023/03/27/audio_8a35b0c92b.mp3" type="audio/mpeg">
</audio>

<script>
const noBtn = document.getElementById("no");
const music = document.getElementById("music");

// MOVER EL BOTÓN NO
function moverNo() {
    const x = Math.random() * 240 - 120;
    const y = Math.random() * 120 - 60;
    noBtn.style.transform = `translate(${x}px, ${y}px) rotate(${Math.random()*30-15}deg)`;
}

// CUANDO ACEPTA
function aceptar() {
    music.play();
    document.getElementById("card").innerHTML = `
        <h1>🎉 ¡Felicidades! 🎉</h1>
        <h1>💗 Somos novios 💗</h1>
        <p style="font-size:18px;color:#e82e6c; margin-top:15px;">
            ¡Estoy tan feliz de que digas que sí! 💕
        </p>
    `;
}

// CORAZONES AUTOMÁTICOS
setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "💗";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (3 + Math.random() * 3) + "s";
    heart.style.fontSize = (18 + Math.random() * 16) + "px";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 6500);
}, 350);

</script>

</body>
</html>
