<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💘 Algo Importante</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:'Segoe UI',sans-serif;
    height:100vh;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* === CARGANDO === */
#loader{
    position:fixed;
    inset:0;
    background:linear-gradient(135deg,#ff5f9e,#ff9acb);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:22px;
    z-index:100;
}

.loader-heart{
    font-size:50px;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    0%{transform:scale(1)}
    50%{transform:scale(1.3)}
    100%{transform:scale(1)}
}

/* === TARJETA === */
.card{
    background:rgba(255,255,255,0.96);
    width:90%;
    max-width:360px;
    padding:30px 20px;
    border-radius:35px;
    text-align:center;
    box-shadow:0 20px 40px rgba(0,0,0,0.25);
    z-index:5;
    display:none;
}

h1{
    color:#e91e63;
    margin-bottom:25px;
    text-shadow:0 0 10px rgba(233,30,99,.5);
}

/* === BOTONES === */
.buttons{position:relative;height:130px}

button{
    padding:15px 28px;
    font-size:18px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 6px 15px rgba(0,0,0,.2);
}

#yes{
    background:linear-gradient(45deg,#ff4081,#ff79a8);
    color:white;
}

#no{
    background:#999;
    color:white;
    position:absolute;
    left:50%;
    top:70px;
    transform:translateX(-50%);
}

/* === CORAZONES === */
.heart{
    position:fixed;
    bottom:-20px;
    font-size:22px;
    animation:floatUp 6s linear infinite;
    opacity:.9;
    z-index:1;
}

@keyframes floatUp{
    to{
        transform:translateY(-110vh) scale(1.6);
        opacity:0;
    }
}

/* === MARCA DE AGUA TEXTO === */
.watermark-text{
    position:fixed;
    bottom:20px;
    width:100%;
    text-align:center;
    font-size:28px;
    font-weight:900;
    letter-spacing:3px;
    color:white;
    text-shadow:
        0 0 10px #fff,
        0 0 20px #ff4f8b,
        0 0 40px #ff1f6d,
        0 0 60px #ff007f;
    animation:glow 1.8s infinite alternate;
    z-index:10;
}

@keyframes glow{
    from{filter:brightness(1)}
    to{filter:brightness(1.6)}
}

/* === LOGO === */
.logo{
    position:fixed;
    top:15px;
    right:15px;
    width:65px;
    height:65px;
    border-radius:18px;
    box-shadow:0 0 20px rgba(255,255,255,.9);
    z-index:15;
}
</style>
</head>

<body>

<!-- CARGANDO -->
<div id="loader">
    <div class="loader-heart">💖</div>
    <p>Cargando algo especial...</p>
</div>

<!-- LOGO -->
<img src="https://cdn.russellxz.click/e7ae3a32.jpeg" class="logo">

<!-- TARJETA -->
<div class="card" id="card">
    <h1>Oye, una pregunta…<br>¿quieres ser mi novia? 💕</h1>
    <div class="buttons">
        <button id="yes" onclick="aceptar()">Sí 💖</button>
        <button id="no" onmouseenter="moverNo()" ontouchstart="moverNo()">No 🙈</button>
    </div>
</div>

<!-- MARCA DE AGUA -->
<div class="watermark-text">CREADOR OFICIAL ELDER .P</div>

<!-- MÚSICA -->
<audio id="music" loop>
    <source src="https://cdn.pixabay.com/audio/2023/03/27/audio_8a35b0c92b.mp3">
</audio>

<script>
const noBtn=document.getElementById("no");
const card=document.getElementById("card");
const loader=document.getElementById("loader");
const music=document.getElementById("music");

/* LOADER */
setTimeout(()=>{
    loader.style.display="none";
    card.style.display="block";
},2200);

/* BOTÓN NO */
function moverNo(){
    const x=Math.random()*260-130;
    const y=Math.random()*120-60;
    noBtn.style.transform=`translate(${x}px,${y}px) rotate(${Math.random()*30-15}deg)`;
}

/* ACEPTAR */
function aceptar(){
    music.play();
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
    card.innerHTML=`
        <h1>🎉 FELICIDADES 🎉</h1>
        <h1>💞 SOMOS NOVIOS 💞</h1>
        <p style="color:#e91e63;font-size:18px;margin-top:15px;">
        Prometo hacerte muy feliz 💕
        </p>
    `;
}

/* CORAZONES */
setInterval(()=>{
    const h=document.createElement("div");
    h.className="heart";
    h.innerText=["💖","💘","💗","💕"][Math.floor(Math.random()*4)];
    h.style.left=Math.random()*100+"vw";
    h.style.fontSize=18+Math.random()*18+"px";
    h.style.animationDuration=4+Math.random()*3+"s";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),7000);
},350);
</script>

</body>
</html>
