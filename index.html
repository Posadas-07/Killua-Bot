<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💘 Pregunta Importante 💘</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        height: 100vh;
        background: linear-gradient(180deg, #ff758c, #ff7eb3);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .card {
        background: rgba(255,255,255,0.95);
        padding: 30px 20px;
        border-radius: 25px;
        width: 90%;
        max-width: 360px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.25);
        z-index: 2;
    }

    h1 {
        color: #ff4f8b;
        margin-bottom: 25px;
        font-size: 24px;
    }

    .buttons {
        position: relative;
        height: 120px;
    }

    button {
        padding: 14px 26px;
        font-size: 18px;
        border-radius: 30px;
        border: none;
        cursor: pointer;
        transition: 0.2s;
    }

    #yes {
        background: linear-gradient(45deg, #ff4f8b, #ff85a1);
        color: white;
    }

    #no {
        background: #999;
        color: white;
        position: absolute;
        left: 50%;
        top: 60px;
        transform: translateX(-50%);
    }

    /* Corazones */
    .heart {
        position: fixed;
        bottom: -20px;
        font-size: 20px;
        animation: float 6s linear infinite;
        opacity: 0.8;
        z-index: 1;
    }

    @keyframes float {
        0% {
            transform: translateY(0) scale(1);
            opacity: 1;
        }
        100% {
            transform: translateY(-110vh) scale(1.5);
            opacity: 0;
        }
    }

    /* Marca de agua GRANDE */
    .watermark {
        position: fixed;
        bottom: 15px;
        width: 100%;
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        color: rgba(255,255,255,0.9);
        letter-spacing: 2px;
        z-index: 3;
        text-shadow: 0 0 10px rgba(0,0,0,0.4);
    }
</style>
</head>

<body>

<div class="card" id="card">
    <h1>💖 ¿Quieres ser mi novia? 💖</h1>
    <div class="buttons">
        <button id="yes" onclick="aceptar()">Sí 💘</button>
        <button id="no" onmouseenter="moverNo()" ontouchstart="moverNo()">No 🙈</button>
    </div>
</div>

<div class="watermark">CREADOR OFC ELDER .P</div>

<!-- Música -->
<audio id="music" loop>
    <source src="https://cdn.pixabay.com/audio/2023/03/27/audio_8a35b0c92b.mp3" type="audio/mpeg">
</audio>

<script>
    const noBtn = document.getElementById("no");
    const music = document.getElementById("music");

    function moverNo() {
        const x = Math.random() * 200 - 100;
        const y = Math.random() * 80 - 40;
        noBtn.style.transform = `translate(${x}px, ${y}px)`;
    }

    function aceptar() {
        music.play();
        document.getElementById("card").innerHTML = `
            <h1>🎉 Felicidades 🎉</h1>
            <h1>💞 Somos novios 💞</h1>
            <p style="color:#ff4f8b;font-size:18px;">Prometo hacerte muy feliz 💕</p>
        `;
    }

    // Corazones automáticos
    setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "💖";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (4 + Math.random() * 3) + "s";
        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 7000);
    }, 400);
</script>

</body>
</html>
